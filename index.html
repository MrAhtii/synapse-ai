<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/nativelyai.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Synapse AI</title>
    <script>
      // Apply the cached theme before first paint to avoid flashing the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem("synapse:theme:mode");
          var dark =
            stored === "dark" ||
            (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
